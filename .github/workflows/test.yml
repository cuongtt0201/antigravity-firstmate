name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tools
        shell: bash
        run: |
          node --version; git --version
          helm version --short || echo "helm: not installed (its checks are skipped)"
      - name: install check
        shell: bash
        run: node install.js --check || true
      - name: tests
        shell: bash
        run: bash tests/run.sh
